.proto-picker {
  position: fixed;
  bottom: 24px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 2147483647;
  display: flex;
  align-items: center;
  gap: 2px;
  padding: 4px;
  border-radius: 999px;
  background: rgba(10, 10, 10, 0.82);
  -webkit-backdrop-filter: blur(12px) saturate(1.4);
  backdrop-filter: blur(12px) saturate(1.4);
  box-shadow:
    0 0 0 1px rgba(255, 255, 255, 0.08) inset,
    0 8px 24px rgba(0, 0, 0, 0.24),
    0 2px 6px rgba(0, 0, 0, 0.12);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 13px;
  line-height: 1;
  -webkit-font-smoothing: antialiased;
  user-select: none;
  -webkit-user-select: none;
}

.proto-picker-highlight {
  position: absolute;
  top: 4px;
  left: 0;
  height: 28px;
  border-radius: 999px;
  background: rgba(255, 255, 255, 0.12);
  will-change: transform;
}

/* The slide is enabled only after first paint (data-ready), so load doesn't animate. */
.proto-picker[data-ready] .proto-picker-highlight {
  transition:
    transform 250ms cubic-bezier(0.23, 1, 0.32, 1),
    width 250ms cubic-bezier(0.23, 1, 0.32, 1);
}

@media (prefers-reduced-motion: reduce) {
  .proto-picker[data-ready] .proto-picker-highlight { transition: none; }
}

.proto-picker-item {
  position: relative; /* sits above the highlight */
  display: flex;
  align-items: center;
  height: 28px;
  padding: 0 12px;
  border: 0;
  border-radius: 999px;
  background: transparent;
  color: rgba(255, 255, 255, 0.55);
  font: inherit;
  cursor: pointer;
  transition: color 150ms ease-out;
}

.proto-picker-item:hover {
  color: rgba(255, 255, 255, 0.85);
}

.proto-picker-item:active {
  transform: scale(0.97);
}

.proto-picker-item:focus-visible {
  outline: 2px solid rgba(255, 255, 255, 0.4);
  outline-offset: 2px;
}

.proto-picker-item[data-active] {
  color: #fff;
}

.proto-picker-divider {
  width: 1px;
  height: 16px;
  margin: 0 4px;
  background: rgba(255, 255, 255, 0.12);
}

.proto-picker-replay {
  padding: 0 10px;
  font-size: 14px;
}

.proto-picker[data-position="top"] {

<main>
 <header class="intro"><div><div class="eyebrow">DD监控室 CE / 比赛二路</div><h1 id="direction">分组工具条</h1><p class="subtitle" id="description"></p></div><span class="page-chip">控制台交互原型 · 不连接直播</span></header>
 <div id="stage"></div>
 <section class="guidance"><article><h2>01 · 图标处理操作</h2><p>裁取悬浮画面、独立播放、重新对齐、区域选择与移除统一使用线性图标；悬停或键盘聚焦显示名称。</p></article><article><h2>02 · 文字保留语义</h2><p>主播名、主画面身份、同步状态、偏移数值保留；“确认对齐并加入”继续使用文字按钮。</p></article><article><h2>03 · 状态直接可见</h2><p>声音和弹幕以图标底色表示开关；静音切换斜杠图标，待确认状态同时使用文字和颜色。</p></article></section>
 <p class="hint">可点击图标、调整音量与偏移、切换主画面。按 1 / 2 / 3 或方向键切换方案。</p>
</main>

<div id="floating-layer"></div>
<dialog class="dialog" id="settings"><h2>比赛二路设置</h2><label>画中画画质<select aria-label="画中画画质"><option>流畅优先：直接裁切</option><option>轻量增强：放大与轻锐化</option></select></label><label>抗波动缓存<select aria-label="抗波动缓存"><option>2 秒 · 低延迟</option><option selected>5 秒 · 均衡</option><option>8 秒 · 抗波动</option></select></label><p>原型内调整只影响本页展示。</p><button class="close" data-action="close-settings">完成</button></dialog>

function audio(r){return `<div class="group">${button(r.sound?'volume':'mute',r.sound?'静音':'开启声音','sound',r.id,r.sound)}<input class="volume" type="range" min="0" max="100" value="${r.volume}" aria-label="${r.name}音量" data-volume="${r.id}"><span class="volume-val">${r.volume}</span><button class="icon channel" aria-label="选择声道，当前${r.channel==='原'?'原始声道':r.channel+'输出'}" data-tip="输出声道" data-action="channel" data-id="${r.id}">${icon('phones')}${r.channel}${icon('chevron')}</button></div>`}
function chat(r){return `<div class="group">${button(r.chat?'chat':'chatoff',r.chat?'关闭弹幕':'开启弹幕','chat',r.id,r.chat)}<button class="icon color-button" aria-label="弹幕来源颜色" data-tip="弹幕来源颜色" data-action="color" data-id="${r.id}"><span class="swatch" style="--row-color:${r.color}"></span>${icon('chevron')}</button></div>`}
function offset(r){return `<div class="offset" title="偏移：正数延后本路，负数相对提前本路">${button('minus','提前 0.1 秒','minus',r.id,null,'small')}<input type="number" step="0.01" min="-60" max="60" value="${r.delay.toFixed(2)}" aria-label="${r.name}偏移秒数" data-delay="${r.id}"><span class="unit">s</span>${button('plus','延后 0.1 秒','plus',r.id,null,'small')}</div>`}
const divider='<span class="divider"></span>';
function extras(r){return `<div class="group">${button('region','选择对照区域','region',r.id)}${button('more','更多操作','more',r.id)}</div>`}
function pending(r){return r.pending?`<div class="pending-line"><p>匹配已完成，请确认两路比赛画面一致</p><button class="join" data-action="join" data-id="${r.id}">${icon('check')}确认对齐并加入</button></div>`:''}
function toolbar(){return `<div class="toolbar"><button class="tool-toggle" aria-pressed="${auto}" data-action="auto"><span class="switch"></span>自动对齐比赛画面</button><button class="tool-toggle" aria-pressed="${compare}" data-action="compare">${icon('compare')}对照微调</button><span class="spacer"></span>${button('plus','添加直播间','add')}${button('settings','比赛二路设置','settings')}${button(collapsed?'chevron':'minus',collapsed?'展开控制台':'收起控制台','collapse')}</div>`}
function footer(){return `<div class="footer"><span class="dot"></span>主画面：${rows.find(r=>r.main)?.name||'未选择'}<span>·</span>本地播放延后约 1.1 秒<span>·</span>${auto?'自动对齐已开启':'手动偏移'}<span class="foot-note">${icon('phones')} 声音已接管</span></div>`}
function renderRow(r){if(mode===0)return `<div class="row" data-row="${r.id}"><div class="rail">${identity(r)}${picture(r)}${divider}${audio(r)}${divider}${chat(r)}${divider}${offset(r)}<span class="spacer"></span>${extras(r)}</div>${pending(r)}</div>`;
 if(mode===1)return `<div class="row" data-row="${r.id}"><div class="rail">${identity(r)}<div class="group">${button('more','更多操作','more',r.id)}</div></div><div class="card-tools"><div class="labeled-group"><span class="caption">画面</span>${picture(r)}</div>${divider}<div class="labeled-group"><span class="caption">声音</span>${audio(r)}</div>${divider}<div class="labeled-group"><span class="caption">弹幕</span>${chat(r)}</div><span class="spacer"></span><span class="caption">偏移</span>${offset(r)}${button('region','选择对照区域','region',r.id)}</div>${pending(r)}</div>`;
 return `<div class="row" data-row="${r.id}"><div class="rail">${identity(r)}${button('pip','裁取悬浮画面','pip',r.id,pipRoom===r.id)}${button(r.sound?'volume':'mute',r.sound?'静音':'开启声音','sound',r.id,r.sound)}${button(r.chat?'chat':'chatoff',r.chat?'关闭弹幕':'开启弹幕','chat',r.id,r.chat)}${offset(r)}${button('sliders',expanded===r.id?'收起详细控制':'展开详细控制','expand',r.id,expanded===r.id)}${button('more','更多操作','more',r.id)}</div>${expanded===r.id?`<div class="inspector"><span class="inspector-title">详细控制</span><div class="labeled-group"><span class="caption">声音</span>${audio(r)}</div>${divider}<div class="labeled-group"><span class="caption">弹幕</span>${chat(r)}</div>${divider}${button('play','独立播放','independent',r.id,r.independent)}${button('sync','重新对齐','resync',r.id)}${button('region','选择对照区域','region',r.id)}</div>`:''}${pending(r)}</div>`}
function render(){document.querySelector('.frame')?.remove();closeLayer();document.getElementById('direction').textContent=['分组工具条','双层卡片','按需展开'][mode];document.getElementById('description').textContent=descriptions[mode];return `<section class="frame ${['grouped','card','compact'][mode]} ${collapsed?'collapsed':''}" aria-label="比赛二路控制台">${toolbar()}${mode===0?'<div class="column-labels"><span class="label-name">直播来源</span><span class="label-picture">画面</span><span class="label-audio">声音</span><span class="label-chat">弹幕</span><span class="label-time">偏移</span><span>其他</span></div>':''}<div class="content">${compare?'<div class="compare-preview"><div class="compare-cell">Machine · 对照区域 <strong>01:31.00</strong></div><div class="compare-cell">大东彦 · 对照区域 <strong>01:31.74</strong></div></div>':''}${rows.map(renderRow).join('')}${pipRoom?`<div class="crop-preview"><div class="preview-pip">${rows.find(r=>r.id===pipRoom)?.name}</div><span>悬浮画面已开启</span><span class="spacer"></span>${button('region','微调悬浮选区','region',pipRoom)}${button('close','关闭悬浮画面','pip',pipRoom)}</div>`:''}</div>${footer()}</section>`}
function refresh(){document.getElementById('stage').innerHTML=render()}
function closeLayer(){document.getElementById('floating-layer')?.replaceChildren()}
function popup(anchor,content){closeLayer();const layer=document.getElementById('floating-layer');layer.innerHTML=`<div class="popover" role="group">${content}</div>`;const pop=layer.firstElementChild,rect=anchor.getBoundingClientRect();pop.style.left=Math.min(rect.left,innerWidth-pop.offsetWidth-15)+'px';pop.style.top=rect.bottom+7+'px'}
function notify(text,undo=false){document.querySelector('.toast')?.remove();const el=document.createElement('div');el.className='toast';el.setAttribute('role','status');el.innerHTML=text+(undo?'<button data-action="undo">撤销</button>':'');document.body.append(el);setTimeout(()=>el.remove(),4000)}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b){if(!e.target.closest('.popover'))closeLayer();return}const action=b.dataset.action,r=rows.find(r=>r.id===b.dataset.id);let update=true;
 if(action==='main'){rows.forEach(row=>row.main=row===r);r.pending=false}
 else if(action==='sound')r.sound=!r.sound;
 else if(action==='chat')r.chat=!r.chat;
 else if(action==='independent'){r.independent=!r.independent;if(r.independent)r.pending=false}
 else if(action==='resync'){r.pending=true;notify('比赛画面已重新匹配，请确认后加入')}
 else if(action==='join'){r.pending=false;r.independent=false;notify(`${r.name} 已加入同步播放`)}
 else if(action==='plus'||action==='minus')r.delay=Math.max(-60,Math.min(60,Math.round((r.delay+(action==='plus'?.1:-.1))*100)/100));
 else if(action==='pip')pipRoom=pipRoom===r.id?null:r.id;
 else if(action==='expand')expanded=expanded===r.id?null:r.id;
 else if(action==='auto')auto=!auto;
 else if(action==='compare')compare=!compare;
 else if(action==='collapse')collapsed=!collapsed;
 else if(action==='settings'){document.getElementById('settings').showModal();update=false}
 else if(action==='close-settings'){document.getElementById('settings').close();notify('原型设置已保留');update=false}
 else if(action==='channel'){popup(b,['原','L','R'].map(c=>`<button data-action="set-channel" data-id="${r.id}" data-value="${c}">${icon('phones')}${c==='原'?'原始声道':c==='L'?'仅左输出':'仅右输出'}${c===r.channel?' ✓':''}</button>`).join(''));update=false}
 else if(action==='set-channel')r.channel=b.dataset.value;
 else if(action==='color'){popup(b,`<div class="palette">${['#38bdf8','#fb7185','#a78bfa','#4ade80','#fbbf24','#fb923c'].map((c,i)=>`<button aria-label="${['蓝色','粉色','紫色','绿色','黄色','橙色'][i]}" style="background:${c}" data-action="set-color" data-id="${r.id}" data-value="${c}"></button>`).join('')}</div>`);update=false}
 else if(action==='set-color')r.color=b.dataset.value;
 else if(action==='more'){popup(b,`<button data-action="info" data-id="${r.id}">${icon('info')}直播流信息</button><button data-action="remove" data-id="${r.id}">${icon('trash')}移除此路</button>`);update=false}
 else if(action==='remove'){lastRemoved=r;rows=rows.filter(row=>row!==r);if(r.main&&rows.length)rows[0].main=true;if(pipRoom===r.id)pipRoom=null;notify(`已移除 ${r.name}`,true)}
 else if(action==='undo'&&lastRemoved){if(lastRemoved.main)rows.forEach(row=>row.main=false);rows.push(lastRemoved);lastRemoved=null}
 else if(action==='add'){if(rows.length<4){rows.push({id:String(Date.now()),name:'KMD',initial:'K',main:!rows.length,sound:false,volume:40,chat:true,color:'#a78bfa',channel:'原',delay:0,cache:'7.9',pending:true,independent:false})}else notify('原型最多展示四路')}
 else if(action==='region'){compare=true;notify(`${r.name} 对照区域已选中，可调整偏移`)}
 else if(action==='info'){notify(`${r.name} · 1920 × 1080 · 60 FPS（原型数据）`);closeLayer();update=false}
 if(update)refresh();
});
document.addEventListener('input',e=>{const id=e.target.dataset.volume||e.target.dataset.delay;if(!id)return;const r=rows.find(row=>row.id===id);if(e.target.dataset.volume){r.volume=Number(e.target.value);e.target.nextElementSibling.textContent=r.volume}else{const v=Number(e.target.value);if(Number.isFinite(v))r.delay=Math.max(-60,Math.min(60,v))}});
const variants=[0,1,2].map(i=>()=>{mode=i;reset();return render()});
// `variants` is an array of render functions, one per variant, in picker order.
const stage = document.getElementById('stage');
const picker = document.querySelector('.proto-picker');
const highlight = picker.querySelector('.proto-picker-highlight');
const items = [...picker.querySelectorAll('.proto-picker-item:not(.proto-picker-replay)')];
const replay = picker.querySelector('.proto-picker-replay');
let current = 0;

function moveHighlight() {
  const el = items[current];
  highlight.style.width = el.offsetWidth + 'px';
  highlight.style.transform = `translateX(${el.offsetLeft}px)`;
}

function mount(i) {
  stage.innerHTML = '';
  // Clear first, render next frame, so entrance animations re-run.
  requestAnimationFrame(() => { stage.innerHTML = variants[i](); });
}

function setActive(i) {
  if (i < 0 || i >= variants.length) return;
  current = i;
  items.forEach((el, j) => {
    el.toggleAttribute('data-active', j === i);
    if (j === i) el.setAttribute('aria-current', 'true');
    else el.removeAttribute('aria-current');
  });
  moveHighlight();
  const url = new URL(location);
  url.searchParams.set('v', i + 1);
  history.replaceState(null, '', url);
  mount(i);
}

items.forEach((el, i) => el.addEventListener('click', () => setActive(i)));
replay?.addEventListener('click', () => mount(current));
window.addEventListener('resize', moveHighlight);

document.addEventListener('keydown', (e) => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const num = parseInt(e.key, 10);
  if (num >= 1 && num <= variants.length) setActive(num - 1);
  else if (e.key === 'ArrowRight') setActive((current + 1) % variants.length);
  else if (e.key === 'ArrowLeft') setActive((current - 1 + variants.length) % variants.length);
  else if (e.key === 'r' || e.key === 'R') mount(current);
});

setActive((parseInt(new URLSearchParams(location.search).get('v'), 10) || 1) - 1);
// Enable the slide only after first paint, so load doesn't animate.
requestAnimationFrame(() => requestAnimationFrame(() => picker.setAttribute('data-ready', '')));

</script>
</html>
