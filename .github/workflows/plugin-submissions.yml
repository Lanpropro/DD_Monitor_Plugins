name: Plugin submissions
on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: 已人工审核的投稿 Issue 编号
        required: true
        type: string
      fingerprint:
        description: 最近一次检查评论中的完整 64 位指纹
        required: true
        type: string
permissions: {}
concurrency:
  group: plugin-submission-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false
jobs:
  check:
    if: github.event_name == 'issues' && github.event.issue.state == 'open'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 tools/plugin_submission.py check
        env:
          GH_TOKEN: ${{ github.token }}
  prepare-pr:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - run: python3 tools/plugin_submission.py approve
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          EXPECTED_FINGERPRINT: ${{ inputs.fingerprint }}
