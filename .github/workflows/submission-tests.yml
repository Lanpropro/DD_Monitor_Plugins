name: Validate plugin submissions
on:
  workflow_dispatch:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: python3 tests/check_plugin_submissions.py
      - run: python3 tests/check_contributing.py
      - run: python3 -m compileall -q tools tests
