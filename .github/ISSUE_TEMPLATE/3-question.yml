name: 使用帮助咨询
description: 询问插件使用方法、设置或其他使用问题。
title: "[使用咨询] "
labels: ["question", "待确认"]
body:
  - type: markdown
    attributes:
      value: 请描述涉及的插件和你想完成的操作。不要填写密码、Cookie 或账号文件，图片和日志附件请先检查个人信息。
  - type: dropdown
    id: plugin
    attributes:
      label: 相关插件
      options:
        - 国内直播平台
        - 海外直播平台
        - 比赛二路同步
        - B站直播互动
        - 网络代理
        - 多个插件或暂不确定
    validations:
      required: true
  - type: input
    id: plugin_version
    attributes:
      label: 插件版本（可选）
      placeholder: 填写插件清单或设置页面显示的版本号；不知道时可留空
    validations:
      required: false
  - type: input
    id: host_version
    attributes:
      label: DD监控室CE 版本（可选）
      placeholder: 填写软件显示的版本号；不知道时可留空
    validations:
      required: false
  - type: textarea
    id: question
    attributes:
      label: 想咨询的问题
      placeholder: 你想完成什么操作？在哪一步不清楚如何继续？
    validations:
      required: true
  - type: textarea
    id: attempts
    attributes:
      label: 已尝试的方法与附件（可选）
      description: 可以附上相关截图或说明参考过的文档，避免重复建议。
    validations:
      required: false
